<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1ST</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
    color:#fff;
    overflow:hidden;
}

.container{
    text-align:center;
    padding:50px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:20px;
    width:min(90%,700px);
    box-shadow:0 20px 60px rgba(0,0,0,.4);
}

h1{
    font-size:5rem;
    letter-spacing:8px;
    margin-bottom:15px;
}

p{
    font-size:1.2rem;
    opacity:.8;
    margin-bottom:30px;
}

button{
    padding:15px 35px;
    font-size:18px;
    border:none;
    border-radius:50px;
    background:#3b82f6;
    color:#fff;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 30px rgba(59,130,246,.5);
}

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(59,130,246,.15);
    animation:float 10s linear infinite;
}

.c1{
    width:220px;
    height:220px;
    top:-60px;
    left:-60px;
}

.c2{
    width:300px;
    height:300px;
    bottom:-100px;
    right:-80px;
    animation-duration:15s;
}

@keyframes float{
    50%{transform:translateY(30px) rotate(180deg);}
    100%{transform:translateY(0) rotate(360deg);}
}
</style>
</head>
<body>

<div class="circle c1"></div>
<div class="circle c2"></div>

<div class="container">
    <h1>1ST</h1>
    <p>Welcome to the 1ST static HTML website.</p>

    <button onclick="hello()">Get Started</button>
</div>

<script>
function hello(){
    alert("🚀 Welcome to 1ST!");
}
</script>

</body>
</html>
